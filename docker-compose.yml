services:
  tg-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-bot
    restart: unless-stopped
    environment:
      # Обязательный токен бота
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      # Необязательное логирование: DEBUG/INFO/WARNING/ERROR
      LOG_LEVEL: INFO
      # Если нужен прокси (например, в некоторых странах):
      # HTTPS_PROXY: http://user:pass@host:port
      # HTTP_PROXY:  http://user:pass@host:port
      # ALL_PROXY:   socks5h://user:pass@host:port
    # Порты НЕ нужны для long-polling; для webhook - см. примечания ниже
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"/tmp/bot_healthy\") else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
